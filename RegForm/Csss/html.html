<DOCTYPE html>
    <html>
<head>
    <title>Student Registartion Page - Saint Peter</title>
    <style>

        body {background-color: beige}
        div {display: inline-block;
            }
        .box {
            z-index: 1;
            display: flexbox;
            border: 1px solid;
            justify-items: center;
            margin: 30px;
            padding: 30px;
            margin-left: 530px;
            border-radius: 10px;
            background-color: whitesmoke;
        }

        h1 {font-size: 55px;
            font-family: 'Times New Roman';
            text-align: center;
            margin-top: 25px;}

        button:hover {
            transition: 0.5s;
            box-shadow: 10px 10px ;
            cursor: pointer;
            
            
        }
    </style>
</head>
<body>


<h1>Student Registration</h1>

<div class="box" >
<div style="padding-right: 50px;">
    
    <form action="image/" method="post">
        <p>Name:</p>
        <input type="text" placeholder="e.g. John Davey Beato">
        <p>Email:</p>
        <input type="email"  placeholder="e.g. kesiajoyaquino@gmail.com">
        <p>Age:</p>
        <input type="number" placeholder="e.g. 18">
        <p>Gender:</p>
        <input type="text" placeholder="e.g. Female">

    </form>
</div>
    

<div style="vertical-align: top;">
    <form action="image/" method="post">
        <p>Skills:</p>
        <input type="text" placeholder="Skills">
        <p>Course:</p>
        <input type="text" placeholder="Course">
        <p>Bio:</p>
        <input type="text" placeholder="Bio">

        <br><br><br><br>

        <button style="margin-left: 50px;
                width: 70px; 
                height:20px;   
                ">Submit</button>
    </form>
</div>

</div>


<footer style=" display: flex;vertical-align: bottom;">
<pre>Members:
    Aquino, Kesia Joy
    Beato, John Davey
    Calos, Robina
    Panganiban, Maria  Gianelli
    Pombo, Criscel
    Guadiana, Ria Mae
    Lucana, Nannette
</pre>
</footer>
    
</body>
</html>
